<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerCompass App</title>
  <meta name="description" content="CareerCompass interactive MVP: onboarding, AI skill picks, realistic hours, timetable and auto-replanning.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html" aria-label="CareerCompass home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-width="2.5"/><g transform="rotate(40 16 16)"><path class="needle-n" d="M16 5.5 19 16h-6z"/><path class="needle-s" d="M16 26.5 13 16h6z"/></g><circle cx="16" cy="16" r="1.8" fill="currentColor"/></svg>
        CareerCompass
      </a>
      <div class="topbar-right">
        <span id="trialBadge"></span>
        <label class="tier-switch">Plan
          <select id="tierSelect" aria-label="Subscription package">
            <option value="silver">Silver</option>
            <option value="gold">Gold</option>
            <option value="platinum">Platinum</option>
          </select>
        </label>
        <button class="btn btn-ghost btn-sm" data-action="reset" type="button">Reset demo</button>
      </div>
    </div>
    <nav class="container stepper" id="stepper" aria-label="Progress"></nav>
  </header>

  <main id="view" class="container" tabindex="-1"></main>

  <div id="modal"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="container">This demo needs JavaScript enabled.</p></noscript>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
